name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: youthfit
          POSTGRES_PASSWORD: youthfit
          POSTGRES_DB: youthfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U youthfit -d youthfit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://youthfit:youthfit@127.0.0.1:5432/youthfit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
