name: Daily ingest

on:
  schedule:
    # 매일 04:00 KST (cron 은 UTC 기준)
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ONTONG_YOUTH_API_KEY: ${{ secrets.ONTONG_YOUTH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - run: uv run python -m app.ingest
      # 적재가 실패해도 오래된 세션은 지운다.
      - if: ${{ !cancelled() }}
        run: uv run python -m app.jobs.cleanup_sessions
