services:
  - type: web
    name: youthfit-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: youthfit-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: youthfit-db
    plan: free
    region: singapore
    databaseName: youthfit
    user: youthfit
    postgresMajorVersion: "16"
